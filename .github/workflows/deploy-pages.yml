name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      - name: Install video encoder
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - name: Render Signal Exchange walkthrough
        run: |
          mkdir -p dist/video
          npx --yes hyperframes@0.8.27 render video/signal-exchange-walkthrough \
            --output dist/video/signal-exchange-walkthrough.mp4 \
            --quality high
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - uses: actions/deploy-pages@v4
        id: deployment

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
