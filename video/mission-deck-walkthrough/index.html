<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mission Deck — How to Use It</title>
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      html,
      body {
        margin: 0;
        width: 1920px;
        height: 1080px;
        overflow: hidden;
        background: #070c10;
      }

      #mission-deck-walkthrough {
        position: relative;
        width: 1920px;
        height: 1080px;
        overflow: hidden;
        background: #070c10;
      }

      .transition-cover {
        position: absolute;
        top: 0;
        left: 1920px;
        width: 1920px;
        height: 1080px;
        z-index: 100;
        pointer-events: none;
      }

      .transition-cover::after {
        content: "";
        position: absolute;
        inset: 0;
        background-image: repeating-linear-gradient(
          90deg,
          rgba(242, 242, 237, 0.08) 0,
          rgba(242, 242, 237, 0.08) 1px,
          rgba(242, 242, 237, 0) 1px,
          rgba(242, 242, 237, 0) 120px
        );
      }

      #transition-1,
      #transition-2 { background-color: #f3a237; }
      #transition-3 { background-color: #27b9ef; }
      #transition-4 { background-color: #9b65ee; }
      #transition-5 { background-color: #17c968; }
      #transition-6 { background-color: #151e24; }
    </style>
  </head>
  <body>
    <main data-hf-id="hf-hick" id="mission-deck-walkthrough" data-composition-id="mission-deck-walkthrough" data-start="0" data-duration="67" data-width="1920" data-height="1080">
      <div data-hf-id="hf-lnl7" id="walkthrough-beat-1" data-composition-id="walkthrough-beat-1" data-composition-src="compositions/beat-1-orient.html" data-start="0" data-duration="11.90" data-track-index="1"></div>
      <div data-hf-id="hf-93jc" id="walkthrough-beat-2" data-composition-id="walkthrough-beat-2" data-composition-src="compositions/beat-2-forge.html" data-start="11.90" data-duration="8.66" data-track-index="1"></div>
      <div data-hf-id="hf-r427" id="walkthrough-beat-3" data-composition-id="walkthrough-beat-3" data-composition-src="compositions/beat-3-approve.html" data-start="20.56" data-duration="10.16" data-track-index="1"></div>
      <div data-hf-id="hf-jijg" id="walkthrough-beat-4" data-composition-id="walkthrough-beat-4" data-composition-src="compositions/beat-4-focus.html" data-start="30.72" data-duration="10.36" data-track-index="1"></div>
      <div data-hf-id="hf-7nv8" id="walkthrough-beat-5" data-composition-id="walkthrough-beat-5" data-composition-src="compositions/beat-5-wild.html" data-start="41.08" data-duration="8.15" data-track-index="1"></div>
      <div data-hf-id="hf-7mll" id="walkthrough-beat-6" data-composition-id="walkthrough-beat-6" data-composition-src="compositions/beat-6-agent.html" data-start="49.23" data-duration="8.19" data-track-index="1"></div>
      <div data-hf-id="hf-b67t" id="walkthrough-beat-7" data-composition-id="walkthrough-beat-7" data-composition-src="compositions/beat-7-undo.html" data-start="57.42" data-duration="9.58" data-track-index="1"></div>

      <audio data-hf-id="hf-x14u" id="walkthrough-narration" src="narration.wav" data-start="0" data-duration="63.253" data-track-index="0" data-volume="1"></audio>

      <div data-hf-id="hf-03mr" id="transition-1" class="transition-cover" data-layout-ignore=""></div>
      <div data-hf-id="hf-p854" id="transition-2" class="transition-cover" data-layout-ignore=""></div>
      <div data-hf-id="hf-pzsx" id="transition-3" class="transition-cover" data-layout-ignore=""></div>
      <div data-hf-id="hf-hbx2" id="transition-4" class="transition-cover" data-layout-ignore=""></div>
      <div data-hf-id="hf-la13" id="transition-5" class="transition-cover" data-layout-ignore=""></div>
      <div data-hf-id="hf-cm58" id="transition-6" class="transition-cover" data-layout-ignore=""></div>
    </main>

    <script>
      window.__timelines = window.__timelines || {};
      const master = gsap.timeline({ paused: true });
      const boundaries = [11.90, 20.56, 30.72, 41.08, 49.23, 57.42];

      boundaries.forEach(function (boundary, index) {
        const selector = "#transition-" + (index + 1);
        master.fromTo(selector, { x: 0 }, { x: -1920, duration: 0.22, ease: "power3.in" }, boundary - 0.22);
        master.to(selector, { x: -3840, duration: 0.28, ease: "power3.out" }, boundary);
        master.set(selector, { x: 0 }, boundary + 0.29);
      });

      window.__timelines["mission-deck-walkthrough"] = master;
    </script>
  </body>
</html>
